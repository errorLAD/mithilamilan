{% extends 'admin_panel/base_admin.html' %}

{% block title %}Homepage CMS | MithilaMilan Admin OS{% endblock %}

{% block content %}
<div class="flex items-center justify-between">
    <div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight font-heading">Homepage Section CMS Manager</h1>
        <p class="text-xs text-slate-500 mt-1">Configure featured homepage items, tagline, and highlighted communities.</p>
    </div>
</div>

<div class="bg-white border border-slate-200/80 rounded-2xl p-6 shadow-xs space-y-4 max-w-2xl">
    <form method="post" class="space-y-4 text-xs">
        {% csrf_token %}
        <div>
            <label class="block text-slate-700 font-bold mb-1">Site Title</label>
            <input type="text" name="site_name" value="{{ setting.site_name }}"
                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 focus:outline-none focus:border-[#E85D2A] focus:bg-white font-medium">
        </div>
        <div>
            <label class="block text-slate-700 font-bold mb-1">Homepage Tagline (जय मिथिला!...)</label>
            <input type="text" name="site_tagline" value="{{ setting.site_tagline }}"
                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 focus:outline-none focus:border-[#E85D2A] focus:bg-white font-medium">
        </div>
        <div>
            <label class="block text-slate-700 font-bold mb-1">Featured Community Slugs (Comma-separated)</label>
            <input type="text" name="featured_community_slugs" value="{{ setting.featured_community_slugs }}" placeholder="e.g. madhubani, darbhanga, maithili-music"
                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 focus:outline-none focus:border-[#E85D2A] focus:bg-white font-medium">
        </div>
        <button type="submit" class="bg-[#E85D2A] hover:bg-[#D54C1A] text-white font-bold py-2.5 px-5 rounded-xl shadow-xs transition-all">
            Save Homepage Config
        </button>
    </form>
</div>
{% endblock %}
