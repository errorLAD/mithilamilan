{% extends 'admin_panel/base_admin.html' %}

{% block title %}UTM Builder | MithilaMilan Admin OS{% endblock %}

{% block content %}
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight font-heading">🔗 UTM URL Builder</h1>
        <p class="text-xs text-slate-500 mt-1">Generate trackable URLs with UTM parameters for Google Analytics and campaign attribution.</p>
    </div>
</div>

<div class="bg-white border border-slate-200/80 rounded-2xl p-6 shadow-xs space-y-6 max-w-3xl" x-data="{
    url: 'https://mithilamilan.com/store/',
    source: 'facebook',
    medium: 'cpc',
    campaign: 'mithila_paintings_sale',
    term: '',
    content: '',
    get generatedUrl() {
        if (!this.url) return '';
        let u = this.url.trim();
        let params = [];
        if (this.source) params.push('utm_source=' + encodeURIComponent(this.source.trim()));
        if (this.medium) params.push('utm_medium=' + encodeURIComponent(this.medium.trim()));
        if (this.campaign) params.push('utm_campaign=' + encodeURIComponent(this.campaign.trim()));
        if (this.term) params.push('utm_term=' + encodeURIComponent(this.term.trim()));
        if (this.content) params.push('utm_content=' + encodeURIComponent(this.content.trim()));
        return params.length ? u + (u.includes('?') ? '&' : '?') + params.join('&') : u;
    },
    copySuccess: false,
    copyToClipboard() {
        navigator.clipboard.writeText(this.generatedUrl);
        this.copySuccess = true;
        setTimeout(() => this.copySuccess = false, 2000);
    }
}">

    <div class="space-y-4 text-xs">
        <div>
            <label class="block text-slate-700 font-bold mb-1">Target Website URL *</label>
            <input type="text" x-model="url" placeholder="https://mithilamilan.com/..."
                   class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 focus:outline-none focus:border-[#E85D2A] focus:bg-white font-medium">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-slate-700 font-bold mb-1">Campaign Source (utm_source) *</label>
                <input type="text" x-model="source" placeholder="google, facebook, whatsapp"
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 focus:outline-none focus:border-[#E85D2A] focus:bg-white font-medium">
            </div>
            <div>
                <label class="block text-slate-700 font-bold mb-1">Campaign Medium (utm_medium) *</label>
                <input type="text" x-model="medium" placeholder="cpc, banner, email, social"
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 focus:outline-none focus:border-[#E85D2A] focus:bg-white font-medium">
            </div>
            <div>
                <label class="block text-slate-700 font-bold mb-1">Campaign Name (utm_campaign) *</label>
                <input type="text" x-model="campaign" placeholder="spring_sale, panchang_2026"
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-900 focus:outline-none focus:border-[#E85D2A] focus:bg-white font-medium">
            </div>
        </div>
    </div>

    <!-- GENERATED URL BOX -->
    <div class="p-4 bg-slate-900 rounded-2xl space-y-3">
        <div class="text-slate-400 font-bold text-xs uppercase tracking-wider">Generated Trackable Link</div>
        <div class="font-mono text-emerald-400 text-xs break-all bg-slate-950 p-3 rounded-xl border border-slate-800" x-text="generatedUrl"></div>
        <button @click="copyToClipboard()" class="bg-[#E85D2A] hover:bg-[#D54C1A] text-white font-bold text-xs py-2 px-4 rounded-xl transition-all flex items-center gap-2">
            <i class="fa-solid fa-copy"></i>
            <span x-text="copySuccess ? '✓ Copied to Clipboard!' : 'Copy URL'"></span>
        </button>
    </div>

</div>
{% endblock %}
