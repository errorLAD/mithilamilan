{% extends 'base.html' %}

{% block title %}Password Reset Complete — MithilaMilan{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-6 px-3 sm:px-6">
    <div class="w-full max-w-md">
        
        <div class="bg-white rounded-3xl border border-slate-200/90 shadow-saas-lg overflow-hidden relative text-center">
            <div class="h-1.5 bg-gradient-to-r from-emerald-500 via-[#E85D2A] to-[#D6A437]"></div>
            
            <div class="p-6 sm:p-8 space-y-6">
                
                <div class="mx-auto w-16 h-16 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center shadow-xs">
                    <i class="fa-solid fa-circle-check text-3xl"></i>
                </div>
                
                <div class="space-y-2">
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight font-devanagari">
                        Password Changed!
                    </h1>
                    <p class="text-xs text-slate-600">
                        Your password has been successfully reset. You can now log in with your new credentials.
                    </p>
                </div>

                <div class="pt-2">
                    <a href="{% url 'users:login' %}" 
                       class="w-full flex items-center justify-center space-x-2 bg-[#E85D2A] hover:bg-[#D54C1A] text-white font-bold text-xs uppercase tracking-wider py-3.5 px-4 rounded-2xl shadow-md shadow-orange-500/20 transition-all min-h-[44px]">
                        <span>Log In Now</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>
{% endblock %}
